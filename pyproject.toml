[project]
name = "gipianoplayer"
version = "1.0.0"
description = "A Python piano playing script that simulates keyboard input"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "keyboard>=0.13.5",
    "windows-curses>=2.4.1",
]

[dependency-groups]
dev = [
    "mypy>=1.14.1",
    "pyinstaller>=6.19.0",
    "ruff>=0.15.6",
    "black>=24.0.0",
]

[tool.uv.workspace]
members = [
    "BGINoti",
]

[tool.mypy]
strict = true
# Allow untyped calls to external libraries without stubs
disallow_untyped_calls = false

[[tool.mypy.overrides]]
module = ["keyboard.*"]
ignore_missing_imports = true

# ============================================================================
# Ruff Configuration
# ============================================================================
[tool.ruff]
# Python version target
target-version = "py38"

# Line length (match Black's default)
line-length = 100

# Exclude directories
exclude = [
    ".git",
    ".mypy_cache",
    ".ruff_cache",
    ".venv",
    "__pycache__",
    "build",
    "dist",
    "BGINoti",
]

[tool.ruff.lint]
# Enable rule sets
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "N",      # pep8-naming
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "SIM",    # flake8-simplify
    "RET",    # flake8-return
    "ARG",    # flake8-unused-arguments
    "PTH",    # flake8-use-pathlib
    "PL",     # pylint
]

# Disable specific rules
ignore = [
    "E501",   # Line too long (handled by formatter)
    "PLR0913", # Too many arguments
    "PLR2004", # Magic value used in comparison
    "N802",   # Function name should be lowercase (allow _format_note style)
    "SIM108", # Use ternary operator (sometimes less readable)
]

# Allow autofix for all enabled rules
fixable = ["ALL"]
unfixable = []

[tool.ruff.lint.per-file-ignores]
# Tests can use assert statements and magic values
"tests/**/*.py" = ["PLR2004", "S101"]
# Scripts can have print statements
"scripts/**/*.py" = ["T201"]

[tool.ruff.lint.isort]
# Group imports
known-first-party = ["src"]
section-order = ["future", "standard-library", "third-party", "first-party", "local-folder"]

[tool.ruff.format]
# Use double quotes for strings
quote-style = "double"
# Indent with spaces
indent-style = "space"
# Respect magic trailing comma
skip-magic-trailing-comma = false
# Auto-detect line ending
line-ending = "auto"

# ============================================================================
# Black Configuration
# ============================================================================
[tool.black]
line-length = 100
target-version = ["py38", "py39", "py310", "py311", "py312"]
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.mypy_cache
  | \.ruff_cache
  | \.venv
  | __pycache__
  | build
  | dist
  | BGINoti
)/
'''
