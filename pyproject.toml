[project]
name = "gipianoplayer"
version = "1.0.0"
description = "A Python piano playing script that simulates keyboard input"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "pynput>=1.7.6",
    "keyboard>=0.13.5",
    "windows-curses>=2.4.1",
]

[dependency-groups]
dev = [
    "mypy>=1.14.1",
    "pyinstaller>=6.19.0",
]

[tool.uv.workspace]
members = [
    "BGINoti",
]

[tool.mypy]
strict = true
# Allow untyped calls to external libraries without stubs
disallow_untyped_calls = false

[[tool.mypy.overrides]]
module = ["keyboard.*", "pynput.*"]
ignore_missing_imports = true
