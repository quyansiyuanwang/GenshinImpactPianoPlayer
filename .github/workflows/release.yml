name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to release
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

    steps:
      - name: Check out release source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Install dependencies
        run: uv sync --group dev --frozen

      - name: Test and check quality
        run: uv run python scripts/lint.py --check

      - name: Build Windows release package
        run: uv run python scripts/build.py

      - name: Create release archive
        shell: pwsh
        run: Compress-Archive -Path release\* -DestinationPath GIPianoPlayer-${env:RELEASE_TAG}-windows-x64.zip

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          generate_release_notes: true
          files: GIPianoPlayer-${{ env.RELEASE_TAG }}-windows-x64.zip
          fail_on_unmatched_files: true
